<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniThrift | Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* GLOBAL & RESET */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3,
        .logo, .unread-badge {
            font-family: 'Baloo 2', 'Inter', sans-serif;
        }

        /* =========================================
           THEMES — "Night Market" (dark) / "Paper Market" (light)
           Same campus thrift-stall palette used across the whole site.
        ========================================= */
        body.dark-theme {
            --bg: #14130f;
            --card: #1e1c15;
            --card-hover: #27241a;
            --text: #f6efe0;
            --secondary: #a39c88;
            --accent: #e8a33d;
            --accent-hover: #cf8c28;
            --accent-soft: #f4c567;
            --accent-rgb: 232, 163, 61;
            --navbar: rgba(20, 19, 15, 0.85);
            --border: rgba(246, 239, 224, 0.08);
            --shadow: rgba(0, 0, 0, 0.55);
            --ring: rgba(232, 163, 61, 0.35);

            /* Notification category colors — each distinct from the brand
               accent (used by "offer") so categories stay tellable apart */
            --sale: #4bab7c;
            --message: #c2622d;
            --offer: #e8a33d;
            --pickup: #3fb6c9;
            --system: #6b8fc7;
            --info: #a39c88;
        }

        body.light-theme {
            --bg: #f3ead4;
            --card: #fffdf8;
            --card-hover: #fffaf0;
            --text: #2c2013;
            --secondary: #7c7156;
            --accent: #d98a26;
            --accent-hover: #b87418;
            --accent-soft: #f0b563;
            --accent-rgb: 217, 138, 38;
            --navbar: rgba(243, 234, 212, 0.75);
            --border: rgba(44, 32, 19, 0.14);
            --shadow: rgba(80, 56, 20, 0.14);
            --ring: rgba(217, 138, 38, 0.28);

            /* Notification category colors (light) */
            --sale: #2f8f5b;
            --message: #b0561f;
            --offer: #d98a26;
            --pickup: #14808f;
            --system: #4c6ea8;
            --info: #7c7156;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.light-theme {
            background-image: radial-gradient(rgba(44, 32, 19, 0.05) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        /* =========================================
           NAVBAR
        ========================================= */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 5%;
            height: 70px;
            background: var(--navbar);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            gap: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.35);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-center a { text-decoration: none; color: var(--secondary); font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-center a:hover, .nav-center a.active { color: var(--accent); }

        .theme-inline-toggle {
            background: none;
            border: none;
            color: var(--secondary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 8px;
            transition: color 0.2s, background-color 0.2s;
        }
        .theme-inline-toggle:hover {
            color: var(--text);
            background-color: rgba(var(--accent-rgb), 0.12);
        }

        body.dark-theme .theme-inline-toggle .fa-sun { display: block; }
        body.dark-theme .theme-inline-toggle .fa-moon { display: none; }
        body.light-theme .theme-inline-toggle .fa-sun { display: none; }
        body.light-theme .theme-inline-toggle .fa-moon { display: block; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-left: auto;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            cursor: pointer;
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-btn:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); cursor: pointer; }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* =========================================
           PAGE LAYOUT
        ========================================= */
        .page-wrap { max-width: 800px; margin: 50px auto; padding: 0 4%; }

        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 35px; flex-wrap: wrap; gap: 14px; }
        .page-header h1 { font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        .page-header h1 i { color: var(--accent); }

        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.25s ease; font-family: 'Inter', sans-serif; }
        .btn-outline { background: var(--card); border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--card-hover); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .unread-badge {
            background: var(--accent); color: white; font-size: 0.75rem; font-weight: 700;
            padding: 3px 9px; border-radius: 12px; min-width: 24px; text-align: center;
            box-shadow: 0 4px 10px rgba(var(--accent-rgb), 0.4);
        }

        /* FILTER TABS */
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            border: 1px solid var(--border); background: var(--card); color: var(--secondary);
            cursor: pointer; transition: all 0.2s ease; font-family: 'Inter', sans-serif;
        }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.35); }
        .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); background: var(--card-hover); }

        /* DATE GROUP HEADERS */
        .notif-group-label {
            font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--secondary); margin: 26px 0 12px 4px;
        }
        .notif-group-label:first-child { margin-top: 0; }

        /* NOTIFICATION LIST COMPONENTS */
        #notifList { display: flex; flex-direction: column; gap: 14px; }

        .notif-card {
            display: flex; align-items: flex-start; gap: 16px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; position: relative;
            box-shadow: 0 4px 12px var(--shadow);
        }
        .notif-card.unread { border-left: 4px solid var(--accent); }
        .notif-card:hover { border-color: var(--accent); background: var(--card-hover); transform: translateY(-2px); }
        .notif-card:hover .notif-dismiss-btn { opacity: 1; }
        .notif-card.read { opacity: 0.65; }

        .notif-icon {
            width: 44px; height: 44px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 1.1rem; flex: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        body.light-theme .notif-icon { border: 1px solid rgba(0, 0, 0, 0.05); }

        .notif-icon.sale    { background: rgba(75, 171, 124, 0.15); color: var(--sale); }
        .notif-icon.message { background: rgba(194, 98, 45, 0.15); color: var(--message); }
        .notif-icon.offer   { background: rgba(var(--accent-rgb), 0.15); color: var(--offer); }
        .notif-icon.pickup  { background: rgba(63, 182, 201, 0.15); color: var(--pickup); }
        .notif-icon.system  { background: rgba(107, 143, 199, 0.15); color: var(--system); }
        .notif-icon.info    { background: rgba(163, 156, 136, 0.15); color: var(--info); }

        .notif-body { flex: 1; padding-top: 2px; min-width: 0; }
        .notif-body p { font-size: 0.95rem; line-height: 1.5; color: var(--text); }
        .notif-body .notif-time { font-size: 0.8rem; color: var(--secondary); margin-top: 6px; display: block; }

        .notif-unread-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent); flex: none; margin-top: 8px;
            box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6);
        }

        .notif-dismiss-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--secondary);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .notif-dismiss-btn:hover { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center; padding: 80px 20px; color: var(--secondary);
        }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 18px; opacity: 0.4; color: var(--accent); }
        .empty-state p { font-size: 0.95rem; }

        /* SKELETON PLACEHOLDERS */
        .skeleton {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 20px;
            display: flex; gap: 16px; align-items: center;
            box-shadow: 0 4px 12px var(--shadow);
        }
        .skel-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--border); flex: none; animation: pulse 1.4s infinite; }
        .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .skel-line { height: 14px; border-radius: 6px; background: var(--border); animation: pulse 1.4s infinite; }
        .skel-line.short { width: 40%; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

        /* =========================================
           TOASTS
        ========================================= */
        .toast-container {
            position: fixed; bottom: 24px; right: 24px; z-index: 6000;
            display: flex; flex-direction: column; gap: 10px;
            max-width: 360px; width: calc(100% - 40px); pointer-events: none;
        }
        .toast {
            pointer-events: auto; display: flex; align-items: flex-start; gap: 12px;
            padding: 14px 16px; border-radius: 14px; background: var(--card);
            border: 1px solid var(--border); box-shadow: 0 12px 30px var(--shadow);
            color: var(--text); font-size: 0.88rem; font-weight: 500;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
        }
        .toast.toast--leaving { animation: toastOut 0.22s ease forwards; }
        .toast-icon {
            flex: none; width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; color: white; margin-top: 1px;
        }
        .toast--success .toast-icon { background: #4bab7c; }
        .toast--error .toast-icon { background: #f43f5e; }
        .toast--warning .toast-icon { background: #c2622d; }
        .toast--info .toast-icon { background: var(--accent); }
        .toast-message { flex: 1; line-height: 1.4; word-break: break-word; }
        .toast-close {
            flex: none; background: none; border: none; cursor: pointer;
            color: var(--secondary); font-size: 0.75rem; padding: 2px; margin-top: 2px;
        }
        .toast-close:hover { color: var(--text); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(8px) scale(0.97); } }

        /* =========================================
           CONFIRMATION MODAL
        ========================================= */
        .confirm-modal-overlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            background: rgba(10, 9, 6, 0.65); backdrop-filter: blur(8px); z-index: 6500;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .confirm-modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
        .confirm-modal-box {
            width: 380px; max-width: 90%; background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px; text-align: center;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6);
            transform: scale(0.95) translateY(10px); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-modal-overlay.open .confirm-modal-box { transform: scale(1) translateY(0); }
        .confirm-modal-icon {
            width: 52px; height: 52px; margin: 0 auto 16px auto; border-radius: 50%;
            background: rgba(244, 63, 94, 0.12); color: #f43f5e;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
        }
        .confirm-modal-box h3 { font-size: 1.15rem; margin-bottom: 8px; }
        .confirm-modal-box p { color: var(--secondary); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
        .confirm-modal-actions { display: flex; gap: 12px; }
        .confirm-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease; font-family: 'Inter', sans-serif; }
        .confirm-btn--ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .confirm-btn--ghost:hover { background: var(--card-hover); }
        .confirm-btn--danger { background: #f43f5e; color: white; }
        .confirm-btn--danger:hover { filter: brightness(0.92); }

        @media(max-width: 768px) {
            .navbar { padding: 0 4%; gap: 15px; }
            .nav-center { display: none; }
            .page-wrap { margin: 30px auto; }
            .page-header h1 { font-size: 1.5rem; }
        }
        @media(max-width: 480px) {
            .toast-container { left: 12px; right: 12px; bottom: 16px; max-width: none; width: auto; }
            .confirm-modal-box { padding: 22px; }
            .confirm-modal-actions { flex-direction: column-reverse; }
        }
    </style>
</head>
<body class="dark-theme">

<nav class="navbar">
    <a href="/marketplace" class="logo">
        <span class="logo-mark"><i class="fas fa-bag-shopping"></i></span>
        UniThrift
    </a>
    <div class="nav-center">
        <a href="/marketplace">Browse</a>
        <!-- Light / Dark toggle element embedded right after Browse link -->
        <button class="theme-inline-toggle" id="themeToggleBtn" title="Toggle Theme">
            <i class="fas fa-sun"></i>
            <i class="fas fa-moon"></i>
        </button>
        <a href="#">Deals</a>
        <a href="/updates" class="active">Updates</a>
    </div>
    <div class="nav-right">
        <button class="icon-btn" onclick="window.location.href='/profile'">
            <i class="fas fa-user"></i>
        </button>
        <div class="nav-avatar" onclick="window.location.href='/profile'">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" id="navAvatar" alt="avatar">
        </div>
    </div>
</nav>

<div class="page-wrap">

    <div class="page-header">
        <h1>
            <i class="fas fa-bell"></i>
            Updates
            <span class="unread-badge" id="unreadCount" style="display:none;">0</span>
        </h1>
        <div class="header-actions">
            <button class="btn btn-outline" id="markAllReadBtn">
                <i class="fas fa-check-double"></i> Mark all read
            </button>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="message"><i class="fas fa-comment"></i> Messages</button>
        <button class="tab-btn" data-filter="offer"><i class="fas fa-hand-holding-dollar"></i> Offers</button>
        <button class="tab-btn" data-filter="pickup"><i class="fas fa-calendar-check"></i> Pickups</button>
        <button class="tab-btn" data-filter="sale"><i class="fas fa-tag"></i> Sales</button>
        <button class="tab-btn" data-filter="system"><i class="fas fa-gear"></i> System</button>
    </div>

    <div id="notifList">
        <div class="skeleton"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
        <div class="skeleton"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
        <div class="skeleton"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
    </div>

</div>

<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<div id="confirmModal" class="confirm-modal-overlay">
    <div class="confirm-modal-box">
        <div class="confirm-modal-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <h3 id="confirmModalTitle">Are you sure?</h3>
        <p id="confirmModalMessage">This action cannot be undone.</p>
        <div class="confirm-modal-actions">
            <button id="confirmModalCancel" class="confirm-btn confirm-btn--ghost">Cancel</button>
            <button id="confirmModalOk" class="confirm-btn confirm-btn--danger">Confirm</button>
        </div>
    </div>
</div>

<script src="/js/auth-fetch.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="/js/updates.js"></script>
</body>
</html>
